name: Atualizar dados

# Todo dia 5, baixa do DATASUS só os arquivos que mudaram desde a última execução, recalcula os indicadores e faz
# commit dos resultados. A hospedagem (Vercel) publica o site de novo a cada commit.
#
# O que torna a execução rápida: o manifesto da coleta (data/datasus/manifesto.json) e as contagens agregadas por
# arquivo (data/agregados/) ficam no git. A coleta compara o manifesto com a listagem do FTP e só baixa arquivos novos
# ou atualizados (em geral os preliminares do ano corrente e do anterior e os meses novos do SIH); o cálculo
# recalcula esses arquivos e usa as contagens guardadas para os demais. Nenhum microdado entra no git.
on:
  schedule:
    - cron: "0 9 5 * *" # dia 5, 06h em Brasília
  workflow_dispatch:
    inputs:
      completo:
        description: "Baixar todos os anos de novo (~1 h). Use se o cálculo de um indicador mudar."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: pip install -r requirements.txt

      - name: Coletar DATASUS (só o que mudou)
        if: ${{ !inputs.completo }}
        run: python coleta/datasus.py --incremental

      - name: Coletar DATASUS (todos os anos)
        if: ${{ inputs.completo }}
        run: |
          rm -rf data/agregados
          python coleta/datasus.py

      - name: População (IBGE)
        run: python coleta/populacao_ibge.py

      - name: Calcular indicadores
        run: python indicadores/construir.py

      - name: Commit dos dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add web/public/dados data/indicadores data/referencia data/agregados data/datasus/manifesto.json
          if git diff --cached --quiet; then
            echo "Nenhum dado novo."
          else
            git commit -m "Atualiza dados do DATASUS ($(date -u +%Y-%m-%d))"
            git push
          fi
